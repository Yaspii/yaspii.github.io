<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Food Spin · Yaspii</title>
<meta name="description" content="Can't decide what to eat? Spin the wheel for a Thai dish and find out what it is.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+SC:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow column (phone-first): header, title, wheel, result card, recent picks */
:root{--bg:#DDE8DC;--card:#EEF3ED;--ink:#173F33;--muted:#4C6B60;--line:#B4CAB6;--accent:#E2A72E;--accent-deep:#875B05;
--display:"Bricolage Grotesque","Noto Sans Thai","Noto Sans SC",system-ui,sans-serif;--body:"Figtree","Noto Sans Thai","Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono","Noto Sans Thai","Noto Sans SC",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0F2A22;--card:#16352C;--ink:#E1ECE2;--muted:#9DB7AA;--line:#27463C;--accent-deep:#E9B24A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px}
.back{display:inline-flex;align-items:center;min-height:44px;font:600 15px var(--body);color:var(--ink);text-decoration:none}
.back:hover{text-decoration:underline}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:500 12px/1 var(--mono);color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 10px;min-height:32px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font:800 clamp(32px,9vw,44px)/1.05 var(--display);letter-spacing:-.025em;margin:6px 0 8px}
:lang(th) h1,:lang(zh-CN) h1{line-height:1.25;letter-spacing:0}
.sub{color:var(--muted);margin:0 0 6px}
.count{font:500 12px var(--mono);color:var(--muted);margin:0}
.wheelbox{position:relative;width:min(100%,360px);aspect-ratio:1;margin:22px auto 6px}
.wheelbox canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:26px solid var(--accent);filter:drop-shadow(0 2px 0 rgba(0,0,0,.18));z-index:1}
.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%;aspect-ratio:1;border-radius:50%;border:5px solid #F1EAD8;background:var(--accent);color:#173F33;font:800 clamp(16px,4.6vw,20px)/1.1 var(--display);cursor:pointer;box-shadow:0 4px 0 #9A6A0C;padding:0 6px}
.spin:active{transform:translate(-50%,-48%);box-shadow:0 2px 0 #9A6A0C}
.spin:disabled{cursor:default}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 0}
.result{background:var(--card);border-radius:16px;padding:20px 20px 22px;margin-top:14px}
.result .th{font:600 15px var(--body);color:var(--muted);margin:0}
.result h2{font:800 30px/1.15 var(--display);letter-spacing:-.01em;margin:4px 0 10px}
:lang(th) .result h2{letter-spacing:0;line-height:1.3}
.chip{display:inline-block;font:500 12px var(--mono);letter-spacing:.03em;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.chip.hot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.result p.desc{margin:12px 0 0;font-size:17px}
.recent{margin-top:22px}
.recent h3{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.recent ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.recent li{background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.spin:active{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="./" data-t="back">← Back</a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh" lang="zh-CN">中文</button><button type="button" data-lang="th" lang="th">ไทย</button></div>
  </header>

  <h1 data-t="title">Thai Food Spin</h1>
  <p class="sub" data-t="sub">Can't decide what to eat? Spin, and we'll pick a Thai dish for you and tell you what it is.</p>
  <p class="count" id="count"></p>

  <div class="wheelbox">
    <canvas id="wheel" width="720" height="720" aria-hidden="true"></canvas>
    <div class="pointer" aria-hidden="true"></div>
    <button class="spin" id="spin" type="button" data-t="spin">SPIN</button>
  </div>
  <p class="hint" id="hint" data-t="hint">Tap the yellow button to spin.</p>

  <section class="result" id="result" aria-live="polite" hidden>
    <p class="th" id="r-th"></p>
    <h2 id="r-name"></h2>
    <span class="chip" id="r-spice"></span>
    <p class="desc" id="r-desc"></p>
  </section>

  <section class="recent" id="recent" hidden>
    <h3 data-t="recent">Recent spins</h3>
    <ul id="recent-list"></ul>
  </section>
</div>

<script src="meal-core.js"></script>
<script>
(function () {
  const M = window.YaspiiMeal;
  const T = {
    en: { title: "Thai Food Spin", sub: "Can't decide what to eat? Spin, and we'll pick a Thai dish for you and tell you what it is.",
          spin: "SPIN", hint: "Tap the yellow button to spin.", again: "Tap again for another dish.", recent: "Recent spins", back: "← Back",
          count: n => n + " Thai dishes. No repeats until you have seen them all.", spice: ["Not spicy", "Mild", "Medium spicy", "Hot"],
          doc: "Thai Food Spin · Yaspii" },
    zh: { title: "泰国美食转盘", sub: "不知道吃什么？转一下，帮你挑一道泰国菜，再告诉你它是什么。",
          spin: "转一转", hint: "点中间的黄色按钮开始。", again: "再点一次，换一道菜。", recent: "最近转到", back: "← 返回",
          count: n => "共 " + n + " 道泰国菜，全部转完之前不会重复。", spice: ["不辣", "微辣", "中辣", "很辣"],
          doc: "泰国美食转盘 · Yaspii" },
    th: { title: "วงล้อสุ่มอาหารไทย", sub: "คิดไม่ออกว่าจะกินอะไร? หมุนเลย แล้วเราจะเลือกอาหารไทยให้ พร้อมบอกว่าคืออะไร",
          spin: "หมุน", hint: "แตะปุ่มสีเหลืองตรงกลางเพื่อหมุน", again: "แตะอีกครั้งเพื่อสุ่มเมนูใหม่", recent: "ที่เพิ่งสุ่มได้", back: "← กลับ",
          count: n => "มีอาหารไทย " + n + " เมนู ไม่ซ้ำจนกว่าจะครบทุกเมนู", spice: ["ไม่เผ็ด", "เผ็ดน้อย", "เผ็ดกลาง", "เผ็ดมาก"],
          doc: "วงล้อสุ่มอาหารไทย · Yaspii" }
  };
  const LANGS = ["en", "zh", "th"];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const $ = id => document.getElementById(id);
  let lang = "en", current = null, recent = [], spinning = false, angle = 0;

  function pickLang() {
    let l = null;
    try { l = new URLSearchParams(location.search).get("lang"); } catch (e) {}
    if (!LANGS.includes(l)) l = store.get("yaspii-lang");
    if (!LANGS.includes(l)) {
      const n = (navigator.language || "en").toLowerCase();
      l = n.startsWith("zh") ? "zh" : n.startsWith("th") ? "th" : "en";
    }
    return l;
  }
  function name(d) { return lang === "zh" ? d.zh : lang === "th" ? d.th : d.en; }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.title = t.doc;
    document.querySelectorAll("[data-t]").forEach(el => { const v = t[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("count").textContent = t.count(M.DISHES.length);
    if (current) {
      $("hint").textContent = t.again;
      $("r-th").textContent = lang === "th" ? current.rom : current.th + " · " + current.rom;
      $("r-name").textContent = name(current);
      $("r-spice").textContent = t.spice[current.spice];
      $("r-spice").className = "chip" + (current.spice >= 2 ? " hot" : "");
      $("r-desc").textContent = current.d[lang];
      $("result").hidden = false;
    } else {
      $("result").hidden = true;
    }
    $("recent").hidden = recent.length < 2;
    $("recent-list").replaceChildren(...recent.slice(1).map(d => { const li = document.createElement("li"); li.textContent = name(d); return li; }));
  }

  /* Wheel: unlabeled segments, so nothing is cut off. The dish comes from the shuffle bag. */
  const cv = $("wheel"), ctx = cv.getContext("2d"), N = 12, TAU = Math.PI * 2;
  const COLORS = ["#173F33", "#2E5A4E", "#3F6E5F", "#567F6F"];
  function draw() {
    const W = cv.width, c = W / 2, R = c - 14, a = TAU / N;
    ctx.clearRect(0, 0, W, W);
    ctx.save(); ctx.translate(c, c); ctx.rotate(angle);
    for (let i = 0; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, i * a - Math.PI / 2, (i + 1) * a - Math.PI / 2); ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
      ctx.save(); ctx.rotate(i * a + a / 2 - Math.PI / 2);
      ctx.beginPath(); ctx.arc(R * 0.78, 0, 9, 0, TAU); ctx.fillStyle = "#E2A72E"; ctx.globalAlpha = .9; ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(c, c, R + 4, 0, TAU); ctx.lineWidth = 10; ctx.strokeStyle = "#E2A72E"; ctx.stroke();
  }

  function spin() {
    if (spinning) return;
    let bag = null;
    try { bag = JSON.parse(store.get("yaspii-food-bag") || "null"); } catch (e) {}
    const r = M.next(bag, store.get("yaspii-food-last"));
    store.set("yaspii-food-bag", JSON.stringify(r.bag));
    store.set("yaspii-food-last", r.dish.id);

    const done = () => {
      spinning = false; $("spin").disabled = false;
      current = r.dish;
      recent = [current].concat(recent.filter(d => d.id !== current.id)).slice(0, 6);
      render();
      $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { done(); return; }
    spinning = true; $("spin").disabled = true;
    const start = angle, end = start + TAU * (4 + Math.random()) + Math.random() * TAU, t0 = performance.now(), dur = 3200;
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      angle = start + (end - start) * e; draw();
      if (p < 1) requestAnimationFrame(step); else { angle = end % TAU; done(); }
    })(t0);
  }

  $("spin").addEventListener("click", spin);
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; store.set("yaspii-lang", lang); render();
  }));
  /* Coming back with the browser's Back/Forward button restores an old snapshot of the page;
     re-read the language so it always matches the rest of the site. */
  window.addEventListener("pageshow", e => { if (e.persisted) { lang = pickLang(); render(); } });

  lang = pickLang();
  draw(); render();
})();
</script>
</body>
</html>
